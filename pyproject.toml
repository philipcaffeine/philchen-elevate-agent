[project]
name = "philchen-elevate-agent"
version = "0.1.0"
description = "Enterprise HR Agentic Virtual Assistant (MVP 1) for Altostrat Singapore on Google Cloud Vertex AI & Cloud Run"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk>=0.1.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
