[project]
name = "philchen-elevate-agent"
version = "0.1.0"
description = "Enterprise HR Agentic Virtual Assistant (MVP 1) for Altostrat Singapore on Google Cloud Vertex AI & Cloud Run"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-cloud-aiplatform[agent-engines,evaluation]>=1.156.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "protobuf>=6.31.1,<7.0.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
package = false
